<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 30, Malte!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Bungee&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2de2e6; --bg2:#ff3cac; --bg3:#ffe600; --ink:#2b0a57; --purple:#7b2ff7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#0f9ea3; --bg2:#b0207a; --bg3:#d8c200; }
}
:root[data-theme="dark"]{ --bg1:#0f9ea3; --bg2:#b0207a; --bg3:#d8c200; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  overflow:hidden;color:var(--ink);
  font-family:"Comic Neue","Comic Sans MS","Chalkboard SE",cursive;
  background-color:var(--bg1);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.35) 0 6px, transparent 7px),
    radial-gradient(circle at 70% 60%, rgba(255,230,0,.55) 0 5px, transparent 6px),
    linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--purple));
  background-size:60px 60px,90px 90px,100% 100%;
  animation:drift 20s linear infinite;
}
@keyframes drift{to{background-position:60px 60px,-90px 90px,0 0}}

.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem}

/* Starburst */
.burst{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;
  background:repeating-conic-gradient(rgba(255,230,0,.55) 0 10deg, transparent 10deg 20deg);
  opacity:0;transform:scale(.2);transition:opacity .4s,transform .8s cubic-bezier(.2,1.5,.4,1);
  animation:spin 30s linear infinite;pointer-events:none}
body.open .burst{opacity:1;transform:scale(1)}
@keyframes spin{to{rotate:360deg}}

/* Gift */
#gift{position:relative;z-index:2;background:none;border:0;cursor:pointer;padding:0;
  animation:hop 1.1s ease-in-out infinite}
#gift:focus-visible{outline:4px dashed #fff;outline-offset:10px;border-radius:12px}
#gift svg{width:min(62vw,240px);height:auto;display:block;filter:drop-shadow(6px 8px 0 rgba(43,10,87,.35))}
#lid{transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .5s .3s}
body.open #lid{transform:translate(40px,-260px) rotate(65deg);opacity:0}
body.open #gift{animation:none;transform:scale(0);transition:transform .35s .35s ease-in}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}

.hint{position:relative;z-index:2;margin-top:1.4rem;font-family:"Bungee",Impact,sans-serif;font-size:clamp(1.2rem,5vw,1.7rem);
  color:#fff;text-shadow:3px 3px 0 var(--ink);animation:blink 1s steps(2,start) infinite}
.for{position:relative;z-index:2;font-family:"Bungee",Impact,sans-serif;font-size:clamp(1.6rem,8vw,2.6rem);
  color:var(--bg3);text-shadow:4px 4px 0 var(--ink);margin:0 0 1rem;transform:rotate(-4deg)}
@keyframes blink{to{visibility:hidden}}
body.open .hint, body.open .for{display:none}

/* Reveal */
.reveal{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1rem;pointer-events:none;visibility:hidden}
body.open .reveal{visibility:visible}
.cake{width:min(56vw,230px);height:auto;transform:scale(0) rotate(-20deg)}
body.open .cake{animation:boing .9s .55s cubic-bezier(.2,1.8,.4,1) forwards}
.flame{transform-origin:50% 100%;animation:flicker .25s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scaleY(1.25) scaleX(.85)}}

.wordart{font-family:"Bungee Shade","Bungee",Impact,sans-serif;font-weight:400;margin:.4rem 0 0;line-height:1;
  font-size:clamp(2.6rem,14vw,5.5rem);
  background:linear-gradient(90deg,#ff3cac,#ffe600,#2de2e6,#7bff6a,#ff3cac);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 4px 0 var(--ink));
  transform:scale(0) rotate(10deg)}
body.open .wordart{animation:boing .8s 1s cubic-bezier(.2,1.8,.4,1) forwards, rainbow 2s 1.8s linear infinite}
.boom{font-family:"Bungee",Impact,sans-serif;font-size:clamp(1.3rem,6vw,2.2rem);line-height:1.2;
  background:#fff;padding:.6rem 1.2rem;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);
  margin-top:1.2rem;max-width:28rem;transform:scale(0) rotate(-6deg)}
body.open .boom{animation:boing .8s 1.6s cubic-bezier(.2,1.8,.4,1) forwards, wobble 2.4s 2.5s ease-in-out infinite}
@keyframes boing{to{transform:scale(1) rotate(0)}}
@keyframes rainbow{to{background-position:200% 0}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.04)}}

/* Balloons */
.balloon{position:absolute;bottom:-160px;z-index:1;width:64px;height:80px;border-radius:50% 50% 48% 52%/55% 55% 45% 45%;
  box-shadow:inset -10px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.35)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:80px;background:rgba(43,10,87,.6)}
.balloon::before{content:"";position:absolute;left:calc(50% - 6px);top:calc(100% - 3px);border:6px solid transparent;border-bottom-color:inherit}
@keyframes rise{to{transform:translate(var(--sway),-130vh) rotate(var(--tilt))}}

canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="stage">
  <div class="burst" aria-hidden="true"></div>
  <p class="for">Für Malte!</p>
  <button id="gift" aria-label="Geschenk öffnen">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <rect x="30" y="90" width="140" height="100" rx="6" fill="#ff3cac" stroke="#2b0a57" stroke-width="5"/>
      <rect x="88" y="90" width="24" height="100" fill="#ffe600" stroke="#2b0a57" stroke-width="5"/>
      <g fill="#fff" opacity=".8"><circle cx="55" cy="120" r="5"/><circle cx="140" cy="160" r="5"/><circle cx="60" cy="170" r="4"/><circle cx="145" cy="115" r="4"/></g>
      <g id="lid">
        <rect x="20" y="64" width="160" height="30" rx="6" fill="#7b2ff7" stroke="#2b0a57" stroke-width="5"/>
        <rect x="88" y="64" width="24" height="30" fill="#ffe600" stroke="#2b0a57" stroke-width="5"/>
        <path d="M100 64 C70 20 40 40 70 62 Z M100 64 C130 20 160 40 130 62 Z" fill="#ffe600" stroke="#2b0a57" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </svg>
  </button>
  <p class="hint">Tippen zum Öffnen!</p>

  <div class="reveal" aria-live="polite">
    <svg class="cake" viewBox="0 0 220 200" aria-hidden="true">
      <g stroke="#2b0a57" stroke-width="5" stroke-linejoin="round">
        <ellipse cx="110" cy="180" rx="100" ry="14" fill="#fff"/>
        <rect x="25" y="115" width="170" height="62" rx="10" fill="#ff3cac"/>
        <path d="M25 128 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 30 0" fill="#fff"/>
        <rect x="50" y="75" width="120" height="44" rx="10" fill="#2de2e6"/>
        <path d="M50 86 q10 14 20 0 q10 14 20 0 q10 14 20 0 q10 14 20 0 q10 14 20 0 q10 14 20 0" fill="#ffe600"/>
        <rect x="82" y="38" width="14" height="38" rx="3" fill="#ffe600"/>
        <rect x="124" y="38" width="14" height="38" rx="3" fill="#7bff6a"/>
      </g>
      <text x="89" y="66" text-anchor="middle" font-family="Bungee,Impact" font-size="16" fill="#2b0a57">3</text>
      <text x="131" y="66" text-anchor="middle" font-family="Bungee,Impact" font-size="16" fill="#2b0a57">0</text>
      <path class="flame" d="M89 36 c-8 -8 -2 -18 0 -24 c2 6 8 16 0 24z" fill="#ff7a00"/>
      <path class="flame" d="M131 36 c-8 -8 -2 -18 0 -24 c2 6 8 16 0 24z" fill="#ff7a00"/>
      <g fill="#fff"><circle cx="60" cy="155" r="4"/><circle cx="110" cy="160" r="4"/><circle cx="160" cy="152" r="4"/></g>
    </svg>
    <h1 class="wordart">Happy 30!</h1>
    <p class="boom">BOOM! 💥 Wir machen einen Goldschmiedekurs! 💍</p>
  </div>
</div>

<script>
(function(){
  var gift=document.getElementById('gift'), stage=document.querySelector('.stage');
  var cv=document.getElementById('fx'), ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1;
  var parts=[], raf=null, opened=false;
  var colors=['#ff3cac','#ffe600','#2de2e6','#7bff6a','#7b2ff7','#ff7a00','#ffffff'];
  function size(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;}
  size(); addEventListener('resize',size);

  function confetti(x,y,n,spread){
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+(Math.random()-.5)*spread, s=(6+Math.random()*12)*dpr;
      parts.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:colors[i%colors.length],
        w:(6+Math.random()*6)*dpr,h:(3+Math.random()*4)*dpr,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
        star:Math.random()<.15,life:160+Math.random()*80});
    }
    if(!raf) loop();
  }
  function star(r){ctx.beginPath();for(var i=0;i<10;i++){var rr=i%2?r/2:r,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.life>0 && p.y<cv.height+40*dpr;});
    parts.forEach(function(p){
      p.vy+=.28*dpr; p.vx*=.985; p.vy*=.985; p.x+=p.vx+Math.sin(p.life/10)*.6*dpr; p.y+=p.vy; p.rot+=p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.star) star(p.w); else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*2))+1);
      ctx.restore();
    });
    raf=parts.length?requestAnimationFrame(loop):null;
  }

  function balloons(){
    var bc=['#ff3cac','#ffe600','#2de2e6','#7bff6a','#7b2ff7','#ff7a00'];
    for(var i=0;i<16;i++){
      var b=document.createElement('div'); b.className='balloon';
      var c=bc[i%bc.length], scale=.7+Math.random()*.6;
      b.style.background=c; b.style.borderColor=c; b.style.color=c;
      b.style.left=(Math.random()*95)+'%';
      b.style.setProperty('--sway',((Math.random()-.5)*120)+'px');
      b.style.setProperty('--tilt',((Math.random()-.5)*30)+'deg');
      b.style.scale=scale;
      b.style.animation='rise '+(6+Math.random()*5)+'s '+(.4+Math.random()*2.5)+'s ease-in infinite';
      stage.appendChild(b);
    }
  }

  gift.addEventListener('click',function(){
    if(opened) return; opened=true;
    var r=gift.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
    document.body.classList.add('open');
    confetti(x,y,220,Math.PI*1.6);
    balloons();
    setTimeout(function(){confetti(innerWidth*.1,innerHeight,90,.9);confetti(innerWidth*.9,innerHeight,90,.9);},1600);
    setTimeout(function(){confetti(innerWidth/2,innerHeight*.35,140,Math.PI*2);},2400);
  });

  document.addEventListener('click',function(e){
    if(opened && e.target!==gift && !gift.contains(e.target)) confetti(e.clientX,e.clientY,60,Math.PI*2);
  });
})();
</script>
</body>
</html>
